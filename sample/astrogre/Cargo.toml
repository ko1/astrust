[package]
name = "astrogre"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# An rlib: koruby links it statically; `are` links it too, and AOT-specialized code
# (a cdylib built at bake time) is compiled against the same rlib.
[lib]
name = "astrogre"
path = "src/lib.rs"

[[bin]]
name = "are"
path = "src/main.rs"

[profile.release]
opt-level = 3
