[package]
name = "saruby"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "saruby"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
astrogre = { path = "../astrogre" }

[features]
# The value stack is src/stack.rs by default: every access checked, no unsafe.  `raw_stack` swaps in
# raw pointers (src/stack_raw.rs) for comparison; see docs/safe_stack.md.  make FEATURES=raw_stack
raw_stack = []
# count node executions per kind in the interpreter (SARUBY_NODEPROF=1 prints the table at exit)
nodeprof = []
# GC backend (runtime/gc): default is "marksweep"; `make GC=bitmap`
gc-marksweep = []
gc-bitmap = []
# rooting checks for the moving-GC migration (docs/gc_moving.md 2.5, 11): quarantined + poisoned
# dead slots (marksweep only) and precise zones in the machine-stack scan.  make FEATURES=gc_check
gc_check = []

[[bin]]
name = "saruby"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = 1
# 1, not 16: with 16 units, which functions share kalloc.rs's unit (allocator inlining) moved benches up to 4 % on
# no-op changes (trials/2026-11-26-saruby-codegen-units). LTO is not possible here (dylib + prefer-dynamic).
codegen-units = 1
incremental = false

[profile.dev]
opt-level = 1
